<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スポーツ大会2026</title>

  <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Yusei Magic', sans-serif;
      background: linear-gradient(to bottom, #fff7c2, #e3f2fd);
      color: #333;
    }

    header {
      background: #3949ab;
      color: white;
      padding: 2rem;
      text-align: center;
      border-radius: 0 0 1.5rem 1.5rem;
    }

    header h1 {
      margin: 0;
      font-size: 3rem;
    }

    .section {
      padding: 2rem;
    }

    .info {
      background: #fff8e7;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .info h2 {
      margin-top: 0;
      color: #3949ab;
    }

    .events {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .event {
      flex: 1 1 150px;
      background: white;
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
      font-size: 1.1rem;
    }

    .event .emoji {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .message {
      background: white;
      border-radius: 1rem;
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
    }

    .message .main-message {
      font-size: 1.5rem;
      font-weight: bold;
      color: #3949ab;
    }

    .message .sub-message {
      font-size: 1.1rem;
    }

    footer {
      background: #3949ab;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2rem;
      }

      .section {
        padding: 1rem;
      }

      .message .main-message {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎉 タキスポ2026 🎉</h1>
    <p>
      テーマ：
      <strong>チームの意地とプライドをかけて戦え</strong>
    </p>
  </header>

  <section class="section info">
    <h2>📅 開催情報</h2>
    <p><strong>日時：</strong>2026年7月4日（土）9:00～16:00</p>
    <p><strong>場所：</strong>千葉ポートアリーナ</p>
  </section>

  <section class="section">
    <h2>🏅 種目</h2>

    <div class="events">

      <div class="event">
        <span class="emoji">🏐</span>
        大玉転がし
      </div>

      <div class="event">
        <span class="emoji">🏀</span>
        玉入れ
      </div>

      <div class="event">
        <span class="emoji">🧠</span>
        クイズ大会
      </div>

      <div class="event">
        <span class="emoji">💪</span>
        綱引き
      </div>

      <div class="event">
        <span class="emoji">🏃‍♂️</span>
        リレー
      </div>

    </div>
  </section>

  <section class="section">
    <h2>🏫 クラス対抗</h2>

    <div class="message">
      <p class="main-message">
        各クラスが誇りを胸に戦う！
      </p>

      <p class="sub-message">
        仲間と力を合わせ、勝利をつかめ！
      </p>
    </div>
  </section>

  <footer>
    <p>© 2026 タキスポ実行委員会</p>
  </footer>

</body>
</html>
